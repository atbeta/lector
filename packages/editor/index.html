<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lector</title>
    <script>
      // 防闪烁：挂载前按系统偏好同步 data-theme
      ;(function () {
        try {
          var m = window.matchMedia('(prefers-color-scheme: dark)')
          var saved = localStorage.getItem('lector-theme')
          document.documentElement.setAttribute(
            'data-theme',
            saved === 'dark' || saved === 'light' ? saved : m.matches ? 'dark' : 'light',
          )
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body class="app">
    <!-- 应用骨架：顶栏通栏 → 侧栏 + 正文 → 状态行通栏。
         顶栏与状态行是「壳」，与内容在同一层，用留白和发丝线分隔，
         不靠常驻边框（初版顶栏那条 1px 线在静止时像线稿）。 -->
    <header id="titlebar" data-tauri-drag-region>
      <div class="titlebar-lead">
        <button type="button" class="btn-icon" id="open-btn" title="打开 (⌘O)" aria-label="打开"></button>
        <button type="button" class="btn-icon" id="save-btn" title="保存 (⌘S)" aria-label="保存"></button>
      </div>
      <div class="titlebar-center">
        <span class="titlebar-title">
          <span id="file-name">Lector</span>
          <span class="dirty-dot" id="dirty-dot" title="有未保存修改"></span>
        </span>
      </div>
      <div class="titlebar-actions">
        <button type="button" class="btn-icon" id="outline-btn" title="大纲 (⌘⇧O)" aria-label="大纲" aria-pressed="false"></button>
        <span class="titlebar-divider" aria-hidden="true"></span>
        <button type="button" class="btn-icon" id="find-btn" title="查找 (⌘F)" aria-label="查找"></button>
        <button type="button" class="btn-icon" id="theme-btn" title="切换主题" aria-label="切换主题"></button>
        <button type="button" class="btn-icon" id="settings-btn" title="设置" aria-label="设置"></button>
      </div>
      <div class="window-controls"></div>
    </header>
    <main id="content"></main>
    <!-- 状态行：文档的一行自述。最弱一级文字，随时可见但不抢正文。 -->
    <footer id="statusbar">
      <span class="status-group" id="status-left"></span>
      <span class="status-group status-right" id="status-right"></span>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
