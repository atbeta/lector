<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lector</title>
    <script>
      // 防闪烁：在样式与模块加载之前定好主题。
      //
      // 主题的真身在设置里（core 的 EditorSettings.theme），壳里存 app 配置目录的
      // lector-settings.json、浏览器里存 localStorage['lector-settings']。
      // 这里必须读同一个 key：早期版本读的是 'lector-theme'，而全仓库没有任何地方
      // 写它，等于防闪烁从未生效——深色用户每次启动都会先闪一下白再变黑。
      //
      // 壳环境下读不到配置文件（要走 IPC，来不及），只能按系统偏好预判；
      // 设置加载完会立刻纠正。这一小段闪动在壳里暂时无法根除，
      // 要彻底解决得由 Rust 把主题注入到 HTML。
      ;(function () {
        try {
          var m = window.matchMedia('(prefers-color-scheme: dark)')
          var theme = null
          var raw = localStorage.getItem('lector-settings')
          if (raw) {
            var parsed = JSON.parse(raw)
            if (parsed && (parsed.theme === 'dark' || parsed.theme === 'light')) theme = parsed.theme
          }
          var resolved = theme || (m.matches ? 'dark' : 'light')
          document.documentElement.setAttribute('data-theme', resolved)
          document.documentElement.setAttribute('data-theme-mode', theme || 'system')
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body class="app">
    <!-- 应用骨架：顶栏通栏 → 侧栏 + 正文 → 状态行通栏。
         顶栏与状态行是「壳」，与内容在同一层，用留白和发丝线分隔，
         不靠常驻边框（初版顶栏那条 1px 线在静止时像线稿）。 -->
    <header id="titlebar" data-tauri-drag-region>
      <div class="titlebar-lead">
        <button type="button" class="btn-icon" id="open-btn" data-tip="打开 (⌘O)" aria-label="打开"></button>
        <button type="button" class="btn-icon" id="save-btn" data-tip="保存 (⌘S)" aria-label="保存"></button>
        <button type="button" class="btn-icon btn-icon-toggle" id="mode-toggle" aria-label="切换编辑模式" aria-pressed="false"></button>
      </div>
      <div class="titlebar-center">
        <span class="titlebar-title">
          <span id="file-name">Lector</span>
          <span class="dirty-dot" id="dirty-dot" data-tip="有未保存修改"></span>
        </span>
      </div>
      <div class="titlebar-actions">
        <button type="button" class="btn-icon" id="outline-btn" data-tip="大纲 (⌘⇧O)" aria-label="大纲" aria-pressed="false"></button>
        <span class="titlebar-divider" aria-hidden="true"></span>
        <button type="button" class="btn-icon" id="find-btn" data-tip="查找 (⌘F)" aria-label="查找"></button>
        <button type="button" class="btn-icon" id="theme-btn" data-tip="切换主题" aria-label="切换主题"></button>
        <button type="button" class="btn-icon" id="settings-btn" data-tip="设置" aria-label="设置"></button>
      </div>
      <div class="window-controls"></div>
    </header>
    <main id="content"></main>
    <!-- 状态行：文档的一行自述。最弱一级文字，随时可见但不抢正文。 -->
    <footer id="statusbar">
      <span class="status-group" id="status-left"></span>
      <span class="status-group status-right" id="status-right"></span>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
