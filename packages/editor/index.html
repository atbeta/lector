<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lector</title>
    <script>
      // 标题必须在**首帧之前**就正确，否则会先闪一下占位的 "Lector" 再变成文档名。
      // 壳在建窗时把文档名通过 initialization_script 放进 window.__lectorTitle，
      // 这段内联脚本在 <head> 里同步执行——比应用脚本更早，也没有网络依赖。
      // 浏览器预览里没有这个变量，退回占位（那时标题由应用自己维护）。
      if (window.__lectorTitle) document.title = window.__lectorTitle
    </script>
    <link rel="icon" href="/lector-mark.svg" type="image/svg+xml" />
    <script>
      // 防闪烁：在样式与模块加载之前定好主题。
      //
      // 主题来源优先级：壳注入（Rust 建窗时同步读 lector-settings.json 塞进
      // window.__lectorTheme，见 io/window.rs build_doc_window）→ localStorage（浏览器
      // 预览）→ 系统偏好。壳注入是唯一能拿到「设置=dark 而系统=light」的路径——
      // 此前缺它，深色用户每次启动都先闪一帧浅色再变深。
      ;(function () {
        try {
          var m = window.matchMedia('(prefers-color-scheme: dark)')
          var mode = window.__lectorTheme
          if (mode !== 'dark' && mode !== 'light' && mode !== 'system') {
            mode = null
            var raw = localStorage.getItem('lector-settings')
            if (raw) {
              var parsed = JSON.parse(raw)
              if (parsed && (parsed.theme === 'dark' || parsed.theme === 'light' || parsed.theme === 'system')) mode = parsed.theme
            }
          }
          var resolved = mode === 'dark' || mode === 'light' ? mode : m.matches ? 'dark' : 'light'
          var de = document.documentElement
          de.setAttribute('data-theme', resolved)
          de.setAttribute('data-theme-mode', mode || 'system')
          // CSS 还没加载，先把画布底色铺上（tokens.css 的 --background 两端值）——
          // 首帧即目标颜色，没有过渡。
          de.style.background = resolved === 'dark' ? 'rgb(15 14 13)' : 'rgb(247 246 243)'
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body class="app">
    <!-- 应用骨架：顶栏通栏 → 侧栏 + 正文 → 状态行通栏。
         顶栏与状态行是「壳」，与内容在同一层，用留白和发丝线分隔，
         不靠常驻边框（初版顶栏那条 1px 线在静止时像线稿）。 -->
    <header id="titlebar" data-tauri-drag-region>
      <div class="titlebar-lead">
        <!-- 大纲：它开关的是**左栏**（侧栏停靠在左），所以开关跟着面板放在左边。
             开关和文件动作之间加发丝线——它是视图控制，不是文件动作。 -->
        <button type="button" class="btn-icon" id="outline-btn" data-tip="大纲" aria-label="大纲" aria-pressed="false"></button>
        <span class="titlebar-divider" aria-hidden="true"></span>
        <button type="button" class="btn-icon" id="open-btn" data-tip="打开 (⌘O)" aria-label="打开"></button>
        <button type="button" class="btn-icon" id="save-btn" data-tip="保存 (⌘S)" aria-label="保存"></button>
      </div>
      <div class="titlebar-center">
        <!-- 标题 + 文件级「更多」：低频文件动作（用其他应用打开 / 导出 PDF / 显示位置 /
             复制路径 / 关闭文件）都收在这一个可见入口里——右键菜单藏着它们，
             用户不会知道；一个贴着文件名的 ⋯ 才有发现性。 -->
        <span class="titlebar-title-wrap">
          <span class="titlebar-title">
            <span id="file-name">Lector</span>
            <span class="dirty-dot" id="dirty-dot" data-tip="有未保存修改"></span>
          </span>
          <button
            type="button"
            class="btn-icon titlebar-more"
            id="file-more-btn"
            aria-haspopup="menu"
            aria-label="更多文件操作"
          ></button>
        </span>
      </div>
      <div class="titlebar-actions">
        <!-- 视图模式：三档常驻的分段控件。放在右侧操作区——
             它决定「这块屏幕现在是什么」，和旁边的应用图标是一类；
             左栏的大纲开关归左边（见 .titlebar-lead）。 -->
        <div class="mode-switch" id="mode-switch"></div>
        <span class="titlebar-divider" aria-hidden="true"></span>
        <!-- 查找不设常驻按钮：⌘F 是所有编辑器/阅读器的通用呼出方式，
             常驻放大镜反而读作「跨文件全局搜索」——那超出本应用的范围。
             入口另有快捷键面板与正文右键菜单。 -->
        <button type="button" class="btn-icon" id="appearance-btn" data-tip="外观" aria-label="外观" aria-haspopup="dialog"></button>
        <button type="button" class="btn-icon" id="settings-btn" data-tip="设置" aria-label="设置"></button>
        <!-- 键位表同理不设常驻按钮：参考资料按 ⌘/ 或 ? 呼出（Gmail/GitHub/Slack 都是这样），
             不在顶栏占一个图标；设置里也有一个可发现的入口。 -->
      </div>
      <div class="window-controls"></div>
    </header>
    <main id="content"></main>
    <!-- 状态行：文档的一行自述。最弱一级文字，随时可见但不抢正文。 -->
    <footer id="statusbar">
      <span class="status-group" id="status-left"></span>
      <span class="status-group status-right" id="status-right"></span>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
