<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lector</title>
    <script>
      // 防闪烁：挂载前按系统偏好同步 data-theme
      ;(function () {
        try {
          var m = window.matchMedia('(prefers-color-scheme: dark)')
          var saved = localStorage.getItem('lector-theme')
          document.documentElement.setAttribute(
            'data-theme',
            saved === 'dark' || saved === 'light' ? saved : m.matches ? 'dark' : 'light',
          )
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <header id="titlebar" data-drag-region>
      <span class="app-title">Lector</span>
      <div class="titlebar-actions">
        <button class="btn btn-ghost" id="open-btn">
          <span class="btn-icon-slot" id="open-glyph"></span>打开
        </button>
        <button class="btn btn-primary" id="save-btn">
          <span class="btn-icon-slot" id="save-glyph"></span>保存
        </button>
        <span class="divider"></span>
        <button class="btn-icon" id="outline-btn" title="大纲 (⌘⇧O)" aria-label="大纲"></button>
        <button class="btn-icon" id="find-btn" title="查找 (⌘F)" aria-label="查找"></button>
        <button class="btn-icon" id="theme-btn" title="切换主题" aria-label="切换主题"></button>
        <button class="btn-icon" id="settings-btn" title="设置" aria-label="设置"></button>
      </div>
      <span id="file-name"></span>
      <span class="dirty-dot" id="dirty-dot" title="有未保存修改"></span>
    </header>
    <main id="content"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
