<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 32 32" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Lector</title>
  <desc id="desc">挺拔立书脊 L 托住三阶舒展阶梯纸页：阅读优先，纯粹克制，极简典雅。</desc>
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E262E"/>
      <stop offset="100%" stop-color="#10151A"/>
    </linearGradient>
    <filter id="l_shadow" x="6" y="4" width="20" height="23" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0.6" dy="1.4" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="32" height="32" rx="7.2" fill="url(#plate)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.7" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="0.6"/>
  
  <!-- 3 阶舒展阶梯纸页（退到后方衬托 L） -->
  <path d="M14 9.2 C18 8.2 22.5 8.9 25 10.8 V13.5 C22.5 11.8 18 11.2 14 12 Z" fill="#64748B" fill-opacity="0.55"/>
  <path d="M14 12.8 C18 11.6 22.5 12.2 25 14.2 V17 C22.5 15.2 18 14.5 14 15.8 Z" fill="#94A3B8" fill-opacity="0.75"/>
  <path d="M14 16.2 C18 14.8 22.5 15.4 25.2 17.5 C25.7 17.9 26 18.5 26 19.1 V20.2 C22 18.2 17.5 18.5 14 20 Z" fill="#E2E8F0"/>
  <path d="M14 16.2 C18 14.8 22.5 15.4 25.2 17.5" stroke="#FFFFFF" stroke-width="0.7" stroke-linecap="round"/>

  <!-- 前景纯白挺拔书脊 L (独立投影，无可争议的绝对主角) -->
  <g filter="url(#l_shadow)">
    <path d="M8.5 7.5 C8.5 6.7 9.2 6 10 6 H13.5 C14.3 6 15 6.7 15 7.5 V18.5 C15 19.3 15.7 20 16.5 20 H22.5 C23.3 20 24 20.7 24 21.5 V22.5 C24 23.3 23.3 24 22.5 24 H11 C9.6 24 8.5 22.9 8.5 21.5 V7.5 Z" fill="#FFFFFF"/>
    <path d="M9.2 6.5 H13.8" stroke="#FFFFFF" stroke-width="0.6" stroke-linecap="round"/>
  </g>
</svg>
