name: ci

# 轻量 CI：所有能在 Linux runner 上跑完的检查。main push / PR 触发。
# 这是发版的「能不能过」闸门;build-windows 只在 tag 上跑实际构建。
on:
  push:
    branches: [main]
  pull_request:

# 与 build-windows 并发跑时不去抢资源：ci 是快检查,不与几分钟的 Windows 构建争。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: test + typecheck + audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 全量历史：下面那条腐化检查要按提交区间比对，浅克隆里 before 提交不存在
          # （第一次就因此红了：Invalid revision range）。仓库很小，代价可忽略。
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck

      # NSIS 安装器文件关联 patch 必须盯着 tauri.conf.json 的同一个 name。
      # 在 Linux runner 上跑,只要能读两个文件,验证逻辑跟 OS 无关。
      - name: Installer hook stays in sync with tauri.conf.json
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys

          conf = json.load(open('clients/tauri/src-tauri/tauri.conf.json', encoding='utf-8'))
          names = sorted({a['name'] for a in conf['bundle']['fileAssociations']})
          exts = sorted({e for a in conf['bundle']['fileAssociations'] for e in a['ext']})
          hooks = pathlib.Path('clients/tauri/src-tauri/windows/nsis-hooks.nsh').read_text(encoding='utf-8')

          m = re.search(r'!define\s+LECTOR_FILE_CLASS\s+"([^"]+)"', hooks)
          hook_class = m.group(1) if m else None

          errs = []
          if hook_class not in names:
              errs.append(f"nsis-hooks.nsh 的 LECTOR_FILE_CLASS={hook_class!r} 不在 {names} 里")
          if 'DefaultIcon' not in hooks:
              errs.append("nsis-hooks.nsh 不再写 DefaultIcon")
          if conf.get('bundle', {}).get('windows', {}).get('nsis', {}).get('installerHooks') != 'windows/nsis-hooks.nsh':
              errs.append("tauri.conf.json 没挂上 windows/nsis-hooks.nsh")

          # .md 图标走独立的 markdown.ico,三处必须串起来:
          # hook 指向的落点 == bundle.resources 的落点,且图标文件真的在仓库里。
          # 串不上时资源管理器只会默默退回 exe 图标,不会有任何报错——所以必须静态挡。
          m_icon = re.search(r'!define\s+LECTOR_FILE_ICON\s+"\$INSTDIR\\([^"]+)"', hooks)
          hook_icon = m_icon.group(1).replace('\\', '/') if m_icon else None
          resources = {k.replace('\\', '/'): v.replace('\\', '/')
                       for k, v in (conf['bundle'].get('resources') or {}).items()}
          if not hook_icon:
              errs.append("nsis-hooks.nsh 的 LECTOR_FILE_ICON 不是 $INSTDIR\\<相对路径> 的形式")
          else:
              if hook_icon not in resources.values():
                  errs.append(f"bundle.resources 里没有落点 {hook_icon!r}（有 {sorted(resources.values())}）")
              for src, dest in resources.items():
                  if dest == hook_icon and not pathlib.Path('clients/tauri/src-tauri', src).exists():
                      errs.append(f"{src} 不存在（改过图标文件却没重新生成？）")

          print(f"class={hook_class} extensions={exts} icon={hook_icon}")
          if errs:
              print("\n".join(errs)); sys.exit(1)
          PY

      # 新引入的替换字符（U+FFFD）不许进仓库。仓库里那 455 处注释腐化不是一次事故，
      # 是一次次编辑攒出来的（某些提交新增的行里就带着它）——所以只清存量没用，
      # 必须挡在门口。只查本次新增的行：存量注释是另一笔账，不该把它弄红。
      # 本机同一套检查挂在 .githooks/pre-commit（git config core.hooksPath .githooks）。
      - name: No new replacement characters
        run: |
          BASE="${{ github.event.before }}"
          [ -n "$BASE" ] || BASE="${{ github.event.pull_request.base.sha }}"
          node tools/check-rot.mjs --range "$BASE..${{ github.sha }}"

      # 设计 token 的静态体检(对比度、字阶、版心、悬空引用)。
      # 渲染层体检(tools/ui-verify.mjs)需要浏览器,留在本机跑;
      # 但它才是能发现「合成后看不见」的那一道,改动界面时必须跑。
      - name: Design token audit
        run: node tools/design-audit.mjs
