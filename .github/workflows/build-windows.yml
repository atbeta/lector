name: build-windows

# Lector 主要面向 Windows。这个流水线是唯一能出 Windows 包的地方：
# NSIS 安装器只能在 Windows 上打，macOS 本机无法交叉打包。
#
# 触发：仅在打 tag 时跑实际构建 + 发布；main push / PR 上的检查由 ci.yml 接管。
# 这样每次 push 不会跑一次 Windows 几分钟的构建，又能保证发版是从「过检的 main」上打的。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: NSIS installer (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: clients/tauri/src-tauri -> target

      - name: Install JS deps
        run: bun install --frozen-lockfile

      # tag 是发布版本的唯一真相，四个版本号必须跟着它走。
      # 不查这一条，v0.2.0 的 Release 里会躺着一个 Lector_0.1.0_x64-setup.exe，
      # 而且要等 Windows job 跑完三分钟才看得出来。
      - name: Tag matches the packaged version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, sys

          tag = os.environ['TAG'].lstrip('v')
          root = pathlib.Path('clients/tauri')
          conf = json.load(open(root / 'src-tauri/tauri.conf.json'))['version']
          pkg = json.load(open(root / 'package.json'))['version']
          cargo = re.search(r'^version\s*=\s*"([^"]+)"',
                            (root / 'src-tauri/Cargo.toml').read_text(), re.M).group(1)
          lock = re.search(r'\[\[package\]\]\nname = "lector"\nversion = "([^"]+)"',
                           (root / 'src-tauri/Cargo.lock').read_text()).group(1)

          found = {'tauri.conf.json': conf, 'clients/tauri/package.json': pkg,
                   'Cargo.toml': cargo, 'Cargo.lock': lock}
          print(f"tag={tag} " + " ".join(f"{k}={v}" for k, v in found.items()))
          bad = [f"{k} = {v}" for k, v in found.items() if v != tag]
          if bad:
              print(f"tag 是 {tag}，但这些文件不是：{', '.join(bad)}")
              print("发版请走 tools/release.mjs，它会把四处一起改掉")
              sys.exit(1)
          PY

      # 壳的写盘/冲突逻辑由 Rust 单测覆盖；原子写在 Windows 上是「先删后改名」，
      # 必须在这个 runner 上真跑一遍，不能只靠 macOS 的结果。
      - name: Shell unit tests
        working-directory: clients/tauri/src-tauri
        run: cargo test --locked

      # beforeBuildCommand 由 Tauri 在仓库根目录执行（已实测），所以必须从根
      # 目录调用，和本机 `bun run tauri:build` 完全一致。
      # 若改成 working-directory: clients/tauri，「cd packages/editor」会找不到路径。
      - name: Build NSIS installer
        run: bun run tauri:build -- --target x86_64-pc-windows-msvc --bundles nsis

      - name: Collect artifacts
        shell: pwsh
        run: |
          $dir = "clients/tauri/src-tauri/target/x86_64-pc-windows-msvc/release"
          $stage = "dist-win"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "$dir/bundle/nsis/*.exe" $stage -ErrorAction Stop
          Copy-Item "$dir/lector.exe" "$stage/lector-portable.exe" -ErrorAction Stop
          Get-ChildItem $stage | Format-Table Name, Length
          "LECTOR_EXE=$stage/lector-portable.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "SETUP_EXE=$(Get-ChildItem "$stage/*setup.exe" | Select-Object -First 1 -ExpandProperty FullName)" |
            Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # NSIS 脚本是压缩存放的，在安装器二进制里 grep 字符串是假阴性。
      # 真正能验 patch 的办法只有一条：静默装一遍，然后读注册表。
      # 装到 runner 的临时目录，验完立刻卸载，不碰 runner 自身环境。
      - name: Install silently and verify the icon registry entry
        shell: pwsh
        run: |
          $class = "Markdown"          # = bundle.fileAssociations[].name
          $install = "$env:TEMP\lector-install"
          $proc = Start-Process -FilePath $env:SETUP_EXE -ArgumentList "/S", "/D=$install" -PassThru -Wait
          Write-Host "installer exit: $($proc.ExitCode)"
          Start-Sleep -Seconds 5

          $bad = @()
          $classKey = "HKCU:\Software\Classes\$class"

          # 1) .md 扩展名要指向这个类键，否则整条关联都没生效。
          foreach ($ext in @(".md", ".markdown", ".txt")) {
            $v = (Get-ItemProperty "HKCU:\Software\Classes\$ext" -ErrorAction SilentlyContinue).'(default)'
            $backup = (Get-ItemProperty "HKCU:\Software\Classes\$ext" -ErrorAction SilentlyContinue)."${class}_backup"
            Write-Host "$ext -> '$v' (backup='$backup')"
            if ($v -ne $class) { $bad += "$ext does not point at the $class class (got '$v')" }
          }

          # 2) 官方只建空 DefaultIcon；patched 后必须指向安装出来的 exe。
          $icon = (Get-ItemProperty "$classKey\DefaultIcon" -ErrorAction SilentlyContinue).'(default)'
          $cmd = (Get-ItemProperty "$classKey\shell\open\command" -ErrorAction SilentlyContinue).'(default)'
          Write-Host "DefaultIcon = '$icon'"
          Write-Host "open command = '$cmd'"
          if (-not $cmd) { $bad += "$class has no shell\open\command" }
          if (-not $icon) { $bad += "$class has no DefaultIcon (patch did not run)" }
          elseif ($icon -notmatch 'Lector\.exe') { $bad += "DefaultIcon does not point at Lector.exe (got '$icon')" }

          $exe = Join-Path $install "Lector.exe"
          if (-not (Test-Path $exe)) { $bad += "installed exe missing at $exe" }

          # 收尾：静默卸载，并确认图标值被清掉。
          $uninst = Join-Path $install "uninstall.exe"
          if (Test-Path $uninst) {
            Start-Process -FilePath $uninst -ArgumentList "/S" -PassThru -Wait | Out-Null
            Start-Sleep -Seconds 5
            $left = (Get-ItemProperty "$classKey\DefaultIcon" -ErrorAction SilentlyContinue).'(default)'
            Write-Host "DefaultIcon after uninstall = '$left'"
            if ($left) { $bad += "uninstall left DefaultIcon behind ('$left')" }
          } else {
            Write-Warning "no uninstaller at $uninst, skipping the uninstall assertion"
          }

          if ($bad.Count -gt 0) {
            $bad | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }
          Write-Host "file association icon entries verified"

      - name: Smoke test the built binary
        shell: pwsh
        run: |
          # 只能验「进程能起来且不退」，GUI 无法在 CI 里做真实交互。
          New-Item -ItemType Directory -Force -Path "$env:TEMP\lector-smoke" | Out-Null
          Set-Content "$env:TEMP\lector-smoke\smoke.md" "# 中文标题`n`n正文段落。`n"
          $p = Start-Process -FilePath $env:LECTOR_EXE `
                -ArgumentList "$env:TEMP\lector-smoke\smoke.md" -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) {
            Write-Error "lector-portable.exe 启动后立即退出，exit code $($proc.ExitCode)"
            exit 1
          }
          Write-Host "process alive after 12s (pid $($p.Id))"
          Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: lector-windows-x64
          path: dist-win/*
          if-no-files-found: error
          retention-days: 30

  # 发版。tag 一推，构建产物直接进 Release——「自动发版」的意义就在于
  # 从 tag 到用户能下载中间不需要有人在浏览器里点。
  release:
    name: publish release
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: lector-windows-x64
          path: dist-win

      # 给下载的人一条自证的路：装之前能自己核一手哈希。
      - name: Checksums
        run: |
          cd dist-win
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -l dist-win
          # v1.2.0-rc.1 这类带后缀的自动标成预发布，不占「最新版」的位置
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 同一个 tag 重跑（构建失败后重试很常见）不该报错，覆盖产物即可
            echo "release $TAG 已存在，改为覆盖上传"
            gh release upload "$TAG" dist-win/*.exe dist-win/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" \
              --title "Lector $TAG" \
              --notes-file .github/release-notes.md \
              --generate-notes \
              $pre \
              dist-win/*.exe dist-win/SHA256SUMS.txt
          fi
          gh release view "$TAG" --json url,name,isPrerelease,assets \
            --jq '"\(.name) \(.url) prerelease=\(.isPrerelease)", (.assets[].name)'

          # 「存在」不等于「已发布」。tag 被删掉再推回来时，GitHub 会把原来的
          # Release 降级成 draft：上传照样成功、断言 tag_name 也照样通过，
          # 但除了有写权限的人，没人看得见这个 Release。
          # 所以这里不是断言，是把状态摆正——发版这件事的终点是「外面下得到」。
          gh release edit "$TAG" --draft=false $pre
          gh release view "$TAG" --json isDraft,isPrerelease \
            --jq '"draft=\(.isDraft) prerelease=\(.isPrerelease)"'

      # 最后一句自证：这个 Release 真的挂在 vX.Y.Z 这个 tag 上。
      #
      # 这条断言来自一次真实的翻车：删掉远端 tag 再推回来时，GitHub 会把原
      # Release 变成游离状态（页面 URL 变成 untagged-<hash>），而 `gh release view`
      # 仍然按名字找得到它——上传照样成功、CI 照样绿，只有点开 Release 的人
      # 会发现它已经不在 tag 底下了。发布这种事，最后一步得自己检查一遍。
      - name: Release is attached to the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag_name=$(gh release view "$TAG" --json tagName --jq .tagName)
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft)
          echo "release tag_name = $tag_name（期望 $TAG）draft = $draft"
          if [ "$tag_name" != "$TAG" ]; then
            echo "::error::Release 没有挂在 $TAG 上（tag_name=$tag_name），页面会是 untagged 状态"
            exit 1
          fi
          if [ "$draft" != "false" ]; then
            echo "::error::Release 还是 draft，外面的人看不到"
            exit 1
          fi
