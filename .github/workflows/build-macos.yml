name: build-macos

# 已公证的 macOS 包。签名 / 公证步骤对齐 NoteFast 的 macos-release.yml：
# 导入 p12 → 自己 codesign → notarytool → staple → 再公证一层 DMG。
# Tauri 只负责打出 .app（--no-sign），缺凭证时它的内置公证只会 warn，不能当闸门。
#
# 触发与 build-windows.yml 相同。Windows 先建 Release；本作业等它出现再挂产物，
# 不互相 needs——公证常要 5–15 分钟，不该拖住 Windows 用户下载。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: signed DMG (arm64)
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: clients/tauri/src-tauri -> target

      - name: Install JS deps
        run: bun install --frozen-lockfile

      # tag 是发布版本的唯一真相。workflow_dispatch 在分支上跑时跳过这条。
      - name: Tag matches the packaged version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, sys

          tag = os.environ['TAG'].lstrip('v')
          root = pathlib.Path('clients/tauri')
          conf = json.load(open(root / 'src-tauri/tauri.conf.json', encoding='utf-8'))['version']
          pkg = json.load(open(root / 'package.json', encoding='utf-8'))['version']
          cargo = re.search(r'^version\s*=\s*"([^"]+)"',
                            (root / 'src-tauri/Cargo.toml').read_text(encoding='utf-8'), re.M).group(1)
          lock = re.search(r'\[\[package\]\]\nname = "lector"\nversion = "([^"]+)"',
                           (root / 'src-tauri/Cargo.lock').read_text(encoding='utf-8')).group(1)

          found = {'tauri.conf.json': conf, 'clients/tauri/package.json': pkg,
                   'Cargo.toml': cargo, 'Cargo.lock': lock}
          print(f"tag={tag} " + " ".join(f"{k}={v}" for k, v in found.items()))
          bad = [f"{k} = {v}" for k, v in found.items() if v != tag]
          if bad:
              print(f"tag 是 {tag}，但这些文件不是：{', '.join(bad)}")
              print("发版请走 tools/release.mjs，它会把四处一起改掉")
              sys.exit(1)
          PY

      - name: Shell unit tests
        working-directory: clients/tauri/src-tauri
        run: cargo test --locked

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="build.keychain"
          # 容忍 secret 内的换行/空白（历史踩坑：base64 文本粘进 secret 时被拆行导致 decode 失败）
          echo "$APPLE_CERTIFICATE" | tr -d '[:space:]' | base64 --decode > /tmp/cert.p12
          test -s /tmp/cert.p12 || { echo "证书解码失败：APPLE_CERTIFICATE 不是有效的 base64 p12" >&2; exit 1; }
          security create-keychain -p "temp" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "temp" "$KEYCHAIN"
          security import /tmp/cert.p12 -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "temp" "$KEYCHAIN"
          rm -f /tmp/cert.p12

      # beforeBuildCommand 的 cwd 是仓库根（与 Windows job 同一条规矩）。
      - name: Build unsigned .app
        run: bun run tauri:build -- --target aarch64-apple-darwin --bundles app --no-sign

      - name: Developer ID sign
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          APP="clients/tauri/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Lector.app"
          if [ ! -d "$APP" ]; then
            APP="clients/tauri/src-tauri/target/release/bundle/macos/Lector.app"
          fi
          test -d "$APP" || { echo "找不到 Lector.app" >&2; ls -R clients/tauri/src-tauri/target/*/release/bundle/macos 2>/dev/null || true; exit 1; }
          echo "APP=$APP" >> "$GITHUB_ENV"
          ENTITLEMENTS="clients/tauri/src-tauri/entitlements.plist"
          xattr -cr "$APP" || true

          # inside-out：先嵌套 Mach-O，再主二进制，最后 bundle
          if [ -d "$APP/Contents/Frameworks" ]; then
            while IFS= read -r file; do
              if file "$file" | grep -q Mach-O; then
                echo "sign ${file#$APP/}"
                codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$file"
              fi
            done < <(find -d "$APP/Contents/Frameworks" -type f ! -type l)
          fi

          MAIN="$(find "$APP/Contents/MacOS" -type f -perm +111 | head -1)"
          test -n "$MAIN" || { echo "找不到主可执行文件" >&2; ls -la "$APP/Contents/MacOS"; exit 1; }
          echo "main=${MAIN#$APP/}"
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" \
            --entitlements "$ENTITLEMENTS" "$MAIN"
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" \
            --entitlements "$ENTITLEMENTS" "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Notarize + staple .app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          STAGE=dist-mac
          mkdir -p "$STAGE"
          ditto -c -k --keepParent "$APP" "$STAGE/Lector.zip"
          xcrun notarytool submit "$STAGE/Lector.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_PASSWORD" --wait \
            2>&1 | tee /tmp/notary.out
          SUBMISSION_ID=$(grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' /tmp/notary.out | head -1)
          STATUS=$(grep -iE 'status: (accepted|invalid|in progress)' /tmp/notary.out | tail -1 | sed 's/.*status: //I' | tr '[:upper:]' '[:lower:]')
          echo "notary status: ${STATUS} (id: ${SUBMISSION_ID})"
          if [ "$STATUS" != "accepted" ]; then
            if [ -n "$SUBMISSION_ID" ]; then
              echo "=== notarytool log（拒绝原因）==="
              xcrun notarytool log "$SUBMISSION_ID" \
                --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_PASSWORD" || true
            fi
            exit 1
          fi
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP" \
            || echo "⚠️ spctl 在 CI 里偶发失败，stapler validate 已通过"

      - name: Build + notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          STAGE=dist-mac
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist")
          DMG="$STAGE/Lector_${VERSION}_arm64-apple-darwin.dmg"
          ZIP="$STAGE/Lector_${VERSION}_arm64-apple-darwin.zip"
          ./tools/make-macos-dmg.sh "$APP" "$DMG"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_PASSWORD" --wait \
            2>&1 | tee /tmp/notary-dmg.out
          STATUS=$(grep -iE 'status: (accepted|invalid|in progress)' /tmp/notary-dmg.out | tail -1 | sed 's/.*status: //I' | tr '[:upper:]' '[:lower:]')
          echo "dmg notary status: ${STATUS}"
          if [ "$STATUS" != "accepted" ]; then
            SUBMISSION_ID=$(grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' /tmp/notary-dmg.out | head -1)
            if [ -n "$SUBMISSION_ID" ]; then
              echo "=== notarytool log（拒绝原因）==="
              xcrun notarytool log "$SUBMISSION_ID" \
                --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_PASSWORD" || true
            fi
            exit 1
          fi
          xcrun stapler staple "$DMG"
          # DMG 无自身代码签名（hdiutil 产物特性），spctl primary-signature 必然 rejected。
          # Gatekeeper 对 DMG 走公证票据，正确验证是 stapler validate。
          xcrun stapler validate "$DMG"
          mv "$STAGE/Lector.zip" "$ZIP"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ls -l "$STAGE"

      - uses: actions/upload-artifact@v4
        with:
          name: lector-macos-arm64
          path: dist-mac/*
          if-no-files-found: error
          retention-days: 30

      - name: Attach to GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          STAGE=dist-mac
          # release-please 没有，Windows job 建 Release；等它出现（最多 5 分钟）
          for i in $(seq 1 60); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            sleep 5
          done
          gh release view "$TAG" >/dev/null 2>&1 || { echo "Release $TAG 未找到" >&2; exit 1; }
          gh release upload "$TAG" \
            "$STAGE"/Lector_*_arm64-apple-darwin.dmg \
            "$STAGE"/Lector_*_arm64-apple-darwin.zip \
            --clobber

          # 把 macOS 校验和追加进 Windows job 写的 SHA256SUMS.txt（重跑时先去掉旧的 arm64 行）
          TMP=$(mktemp -d)
          if gh release download "$TAG" --dir "$TMP" --pattern SHA256SUMS.txt; then
            {
              grep -v 'arm64-apple-darwin' "$TMP/SHA256SUMS.txt" || true
              (cd "$STAGE" && shasum -a 256 Lector_*_arm64-apple-darwin.dmg Lector_*_arm64-apple-darwin.zip)
            } > "$TMP/SHA256SUMS.txt.new"
            mv "$TMP/SHA256SUMS.txt.new" "$TMP/SHA256SUMS.txt"
            gh release upload "$TAG" "$TMP/SHA256SUMS.txt" --clobber
            cat "$TMP/SHA256SUMS.txt"
          else
            echo "SHA256SUMS.txt 还没挂上，只传了 dmg/zip"
          fi
