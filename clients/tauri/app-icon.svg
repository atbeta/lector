<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 32 32" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Lector</title>
  <desc id="desc">墨蓝底板，象牙色 L 托住 M：竖粗横细、平切收尾，像书页上的铅字；右上一条砖红书签丝带落在 M 的粗竖上。满幅稿，给 Windows .ico（32px 起）、PNG 与页面里的品牌块。</desc>
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="32" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#3B4F5E"/><stop offset="0.55" stop-color="#28363F"/><stop offset="1" stop-color="#1B242B"/></linearGradient>
    <linearGradient id="ivory" x1="0" y1="8" x2="0" y2="24" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FAF6EE"/><stop offset="1" stop-color="#EAE2D3"/></linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="7" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#9E3E2C"/><stop offset="1" stop-color="#C9573C"/></linearGradient>
    <filter id="sit" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="0.3" stdDeviation="0.3" flood-color="#0B1014" flood-opacity="0.35"/></filter>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="16" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <clipPath id="clip"><rect width="32" height="32" rx="7.2"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="32" height="32" fill="url(#plate)"/>
    <!-- 丝带：宽度正好等于 M 的粗竖（缩放后），从顶边垂下 -->
    <path d="M21.72 0H24.48V6.1L23.1 5L21.72 6.1Z" fill="url(#ribbon)" filter="url(#sit)"/>
  </g>
  <!-- 只有上半圈的高光内沿，不用光斑 -->
  <rect x="0.25" y="0.25" width="31.5" height="31.5" rx="6.95" stroke="url(#rim)" stroke-width="0.5"/>
  <g transform="translate(16 16) scale(1.06) translate(-16 -16)">
    <g fill="url(#ivory)" filter="url(#sit)">
      <path d="M8 8H10.9V20.6A1.8 1.8 0 0 0 12.7 22.4H24V24H8Z"/>
      <path d="M13.5 8H16.5L18.995 13.311L20.2 8H24V19.6H21.4V8.8L18.95 19.6L14.6 10.341V19.6H13.5Z"/>
    </g>
  </g>
</svg>
