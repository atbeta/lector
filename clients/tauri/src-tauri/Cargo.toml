[package]
name = "lector"
version = "0.4.0"
description = "Lector — a reading-first Markdown editor"
authors = ["Lector"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "lector_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-single-instance = "2"
notify = "8.0.0"
