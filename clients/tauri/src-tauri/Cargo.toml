[package]
name = "lector"
version = "0.33.0"
description = "Lector — a reading-first Markdown editor"
authors = ["Lector"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "lector_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-single-instance = "2"
# 剪贴板**读**：webview 的 navigator.clipboard.readText() 在 macOS 的 WKWebView 里
# 一律被拒（Tauri v2 把剪贴板从 core 挪到了独立插件，不装就没有这条能力），
# 于是右键菜单里的「粘贴」永远失败。Windows/WebView2 上本来就通，
# 装它是为了让两个平台行为一致。只开 allow-read-text——写（复制）走 navigator 一直好用，
# 不给多余的能力。
tauri-plugin-clipboard-manager = "2"
# 记住窗口尺寸/位置/最大化状态，下次启动恢复。
# 官方插件（crates.io 上的 tauri-plugin-window-state），只在 Rust 侧使用，
# 不开放它的 JS 命令，所以 capabilities 不需要加 window-state:default。
tauri-plugin-window-state = "2"
notify = "8.0.0"
# 只为解析文档里的 file:// 链接（百分号转义、Windows 盘符、UNC 都比手写稳）。
# tauri 自己已经把它拉进依赖图了，这里只是正式声明。
url = "2"

# 仅 Windows 用：透明无边框窗口 + Mica/Acrylic 材质换系统圆角与原生投影
# （io/window.rs::apply_platform_window_tweaks）。
[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.8.0"
# PDF 导出（pdf.rs）：WebView2 PrintToPdf 的 COM 互操作。
# 版本必须与 wry 拉入的一致（Cargo.lock 里 webview2-com 0.38 / windows 0.61）——
# 出现两个版本时 ICoreWebView2Controller 类型对不上，编译直接失败。
webview2-com = "0.38"
windows-core = "0.61"
# 应用图标提取（io/appinfo.rs）：HICON 像素编码成 PNG 给 webview 显示。
png = "0.17"
# Snap Layouts 覆盖层（snap.rs）：不绘制的子窗口对 WM_NCHITTEST 回答 HTMAXBUTTON
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_LibraryLoader",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSButton", "NSView", "NSWindow"] }
