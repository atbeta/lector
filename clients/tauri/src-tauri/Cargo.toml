[package]
name = "lector"
version = "0.24.2"
description = "Lector — a reading-first Markdown editor"
authors = ["Lector"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "lector_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-single-instance = "2"
# 记住窗口尺寸/位置/最大化状态，下次启动恢复。
# 官方插件（crates.io 上的 tauri-plugin-window-state），只在 Rust 侧使用，
# 不开放它的 JS 命令，所以 capabilities 不需要加 window-state:default。
tauri-plugin-window-state = "2"
notify = "8.0.0"

# 仅 Windows 用：透明无边框窗口 + Mica/Acrylic 材质换系统圆角与原生投影
# （io.rs::apply_platform_window_tweaks）。
[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.8.0"
# Snap Layouts 覆盖层（snap.rs）：不绘制的子窗口对 WM_NCHITTEST 回答 HTMAXBUTTON
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
] }
